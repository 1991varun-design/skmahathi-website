name: Update latest YouTube videos

on:
  schedule:
    - cron: "17 3 * * *"   # every day, about 08:47 India time
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch newest videos
        env:
          YT_HANDLE: skMahathi
          YT_CHANNEL_ID: ${{ vars.YT_CHANNEL_ID }}   # optional; looked up from the handle if empty
        run: python3 scripts/update_videos.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/videos.json
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "Update latest YouTube videos"
            git push
          fi
